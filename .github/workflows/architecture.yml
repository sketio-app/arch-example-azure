name: architecture
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  arch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # mode: diff reads the pull request's head commit
      - uses: sketio-app/action@fe5cf00bb30c6f4ff97eb56fb83b4b307d1777ce # v1.8.0
        with:
          mode: ${{ github.event_name == 'pull_request' && 'diff' || 'sync' }}
          api-url: https://arch.sketio.app
